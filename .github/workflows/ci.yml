name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit (lint, format, types, stubs, hygiene)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: pip install "pre-commit==4.3.0"
      - name: Run all hooks
        run: pre-commit run --all-files --show-diff-on-failure

  commit-messages:
    name: Conventional commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check every commit message with commitizen
        run: pipx run --spec commitizen==4.19.2 cz check --rev-range HEAD

  test-solutions:
    name: Full test suite vs solutions (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install reference solutions
        run: python scripts/install_solutions.py --all
      - name: Run every test (includes assembling and running all sample programs)
        run: python -m utils.checker

  notebooks:
    name: Execute all notebooks vs solutions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install notebook tooling
        run: pip install nbclient nbformat ipykernel
      - name: Install reference solutions
        run: python scripts/install_solutions.py --all
      - name: Execute notebooks
        run: python scripts/run_notebooks.py
