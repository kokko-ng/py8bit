name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install "ruff==0.14.10" "mypy==1.19.1"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy src utils scripts

  stubs-fresh:
    name: Generated stubs match solutions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check stub freshness
        run: python scripts/generate_stubs.py --check

  test-solutions:
    name: Full test suite vs solutions (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install reference solutions
        run: python scripts/install_solutions.py --all
      - name: Run every test (includes assembling and running all sample programs)
        run: python -m utils.checker

  notebooks:
    name: Execute all notebooks vs solutions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install notebook tooling
        run: pip install nbclient nbformat ipykernel
      - name: Install reference solutions
        run: python scripts/install_solutions.py --all
      - name: Execute notebooks
        run: python scripts/run_notebooks.py
